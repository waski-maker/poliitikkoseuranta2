name: Varmuuskopiot

# Daily encrypted full backup (pg_dump + files) to the configured backup
# target, and a monthly restore test into a throw-away PostgreSQL container.
on:
  schedule:
    - cron: '30 1 * * *'
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'backup tai verify'
        default: backup

concurrency:
  group: backups
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      verifydb:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SETTINGS_ENCRYPTION_KEY: ${{ secrets.SETTINGS_ENCRYPTION_KEY }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_TARGET: ${{ vars.BACKUP_TARGET || 's3' }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_VERIFY_DATABASE_URL: postgres://postgres:verify@localhost:55432/verify
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'supabase' }}
    steps:
      - name: Tarkista asetukset
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_ENCRYPTION_KEY" ]; then echo "::warning::DATABASE_URL tai BACKUP_ENCRYPTION_KEY puuttuu. Ohitetaan."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.cfg.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
      - if: steps.cfg.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.cfg.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.cfg.outputs.skip != 'true'
        name: PostgreSQL 17 -asiakas
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - if: steps.cfg.outputs.skip != 'true' && (github.event.schedule == '30 1 * * *' || github.event.inputs.mode == 'backup')
        name: Täysi varmuuskopio
        run: pnpm job run backup:full
      - if: steps.cfg.outputs.skip != 'true' && (github.event.schedule == '0 4 1 * *' || github.event.inputs.mode == 'verify')
        name: Kuukausittainen palautustesti
        run: pnpm job run backup:verify
