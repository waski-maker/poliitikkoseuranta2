name: Supabase – migraatiot ja Edge Function

# Runs migrations (with an automatic encrypted backup first) and deploys the
# API as a Supabase Edge Function. Requires secrets set by `pnpm deploy:setup`:
#   DATABASE_URL, SUPABASE_ACCESS_TOKEN, SETTINGS_ENCRYPTION_KEY, BACKUP_ENCRYPTION_KEY
# and the variable SUPABASE_PROJECT_REF.
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'apps/api/**', 'apps/worker/**', 'packages/core/**', 'modules/**']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tarkista asetukset
        id: cfg
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$REF" ]; then
            echo "::warning::Supabase-asetuksia ei ole tehty (aja pnpm deploy:setup). Ohitetaan."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
      - if: steps.cfg.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.cfg.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.cfg.outputs.skip != 'true'
        name: PostgreSQL-asiakas (pg_dump varmuuskopiota varten)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - if: steps.cfg.outputs.skip != 'true'
        name: Migraatiot ja alkudata
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SETTINGS_ENCRYPTION_KEY: ${{ secrets.SETTINGS_ENCRYPTION_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_TARGET: ${{ vars.BACKUP_TARGET || 'local' }}
          BACKUP_LOCAL_DIR: ./backups
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          pnpm db:migrate
          pnpm db:seed
      - if: steps.cfg.outputs.skip != 'true'
        name: Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          pnpm build:edge
          npx -y supabase@latest functions deploy api --no-verify-jwt --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
